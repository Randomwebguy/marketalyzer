<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="marketalyzer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<title>marketalyzer · Giriş</title>
</head>
<body class="login-page">
<main class="login">
  <img src="/static/icons/icon-192.png" alt="" width="64" height="64">
  <h1>marketalyzer</h1>
  <p>BIST için backtest ve sanal hesapla işlem denemeleri. Gerçek para kullanılmaz.</p>
  <form method="post" action="/login" class="card">
    <label class="field">Erişim anahtarı
      <input name="token" type="password" autocomplete="current-password" required autofocus>
    </label>
    <p class="error" id="error" hidden>Anahtar hatalı. Sunucuyu başlatırken yazdırılan anahtarı girin.</p>
    <button class="btn primary block">Giriş yap</button>
  </form>
  <p class="muted small">Anahtar, <code>marketalyzer-web</code> veya <code>scripts/tunnel.sh</code> başlarken ekrana yazdırılır.</p>
</main>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("error").hidden = false;
</script>
</body>
</html>
